name: Deploy to AWS

on:
  push:
    branches:
      - dev
      - staging
      - prod
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  AWS_REGION: us-east-1
  BASE_STACK_NAME: sam-login-rahul

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Environment & Stack Name
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_ENV="${{ github.event.inputs.environment }}"
          else
            case "${{ github.ref_name }}" in
              dev)
                TARGET_ENV="dev"
                ;;
              staging)
                TARGET_ENV="staging"
                ;;
              prod)
                TARGET_ENV="prod"
                ;;
              *)
                TARGET_ENV="dev"
                ;;
            esac
          fi

          STACK_NAME="${{ env.BASE_STACK_NAME }}-${TARGET_ENV}"

          echo "Target Environment: $TARGET_ENV"
          echo "Stack Name: $STACK_NAME"

          echo "TARGET_ENV=$TARGET_ENV" >> $GITHUB_ENV
          echo "STACK_NAME=$STACK_NAME" >> $GITHUB_ENV

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build SAM Application
        run: sam build

      - name: Deploy SAM Infrastructure & Backend
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --config-env ${{ env.TARGET_ENV }} \
            --stack-name ${{ env.STACK_NAME }} \
            --s3-prefix ${{ env.STACK_NAME }} \
            --parameter-overrides Stage=${{ env.TARGET_ENV }} \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --region ${{ env.AWS_REGION }}

      - name: Deploy Frontend to S3 & Invalidate CloudFront
        run: |
          echo "Fetching CloudFormation outputs for ${{ env.STACK_NAME }}..."
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='ApiURL'].OutputValue" \
            --output text)

          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" \
            --output text)

          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" \
            --output text)

          WEBSITE_URL=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='WebsiteURL'].OutputValue" \
            --output text)

          echo "API URL: $API_URL"
          echo "Bucket: $BUCKET_NAME"
          echo "CloudFront Distribution: $DISTRIBUTION_ID"
          echo "Website URL: $WEBSITE_URL"

          # Inject active API endpoint into index.html
          sed -i "s|__API_URL__|$API_URL|g" frontend/index.html

          # Upload directly to S3
          aws s3 cp frontend/index.html "s3://${BUCKET_NAME}/index.html"

          # Invalidate CloudFront cache
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"

          # Output summary to GitHub Actions UI
          echo "### 🚀 Deployment Successful (\`${{ env.TARGET_ENV }}\`)" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** \`${{ env.TARGET_ENV }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Stack Name:** \`${{ env.STACK_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend URL:** $WEBSITE_URL" >> $GITHUB_STEP_SUMMARY
          echo "- **API URL:** $API_URL" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 Bucket:** \`$BUCKET_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudFront ID:** \`$DISTRIBUTION_ID\`" >> $GITHUB_STEP_SUMMARY
